<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل مدیریت</title>
<!-- اسکریپت رسمی مینی‌اپ بله - باید قبل از هر اسکریپت دیگه لود بشه -->
<script src="https://tapi.bale.ai/miniapp.js?3"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="app">
    <div id="loading" class="center-box">در حال بارگذاری…</div>

    <!-- کاربر عادی / بدون دسترسی اجازه‌ی ورود نداره -->
    <div id="unauthorized" class="center-box hidden">
      <p>🚫 این بخش فقط برای مدیران و مالک بات در دسترسه.</p>
    </div>

    <!-- مرحله‌ی دریافت شماره تلفن -->
    <div id="phone-step" class="center-box hidden">
      <p>برای ورود به پنل مدیریت، لطفاً شماره تلفنت رو به اشتراک بذار.</p>
      <button id="share-phone-btn" class="primary-btn">📱 اشتراک‌گذاری شماره تلفن</button>
      <p class="hint">اگه دکمه کار نکرد، برگرد به چت بات و شماره‌ت رو از همون‌جا بفرست.</p>
    </div>

    <!-- پنل اصلی -->
    <div id="main-view" class="hidden">
      <header class="topbar">
        <span id="role-badge"></span>
        <nav id="tabs" class="tabs"></nav>
        <button id="resign-btn" class="icon-btn hidden" title="انصراف از مدیریت">🚪</button>
      </header>

      <!-- تب گفتگوها -->
      <section id="tab-threads" class="tab-panel">
        <div id="thread-list" class="thread-list"></div>
        <div id="thread-detail" class="thread-detail hidden">
          <div class="thread-toolbar">
            <button id="back-btn" class="icon-btn">→ برگشت</button>
            <span id="thread-title" class="thread-title"></span>
            <button id="block-btn" class="danger-btn small-btn">مسدود کردن</button>
            <button id="delete-btn" class="danger-btn small-btn">حذف گفتگو</button>
          </div>
          <div id="admin-messages" class="messages"></div>
          <div id="reply-preview-bar" class="reply-preview-bar hidden">
            <span id="reply-preview-text"></span>
            <button id="cancel-reply-btn" class="icon-btn">✖</button>
          </div>
          <form id="admin-send-form" class="send-bar">
            <input id="admin-text-input" type="text" placeholder="پاسخ…" autocomplete="off" />
            <button type="submit" class="primary-btn">ارسال</button>
          </form>
        </div>
      </section>

      <!-- تب درخواست‌های مدیریت (فقط مالک) -->
      <section id="tab-requests" class="tab-panel hidden">
        <div id="requests-list" class="list-box"></div>
      </section>

      <!-- تب مدیران (فقط مالک) -->
      <section id="tab-admins" class="tab-panel hidden">
        <div id="admins-list" class="list-box"></div>
      </section>

      <!-- تب واحدها (فقط مالک) -->
      <section id="tab-units" class="tab-panel hidden">
        <form id="unit-create-form" class="unit-create-form">
          <input id="unit-name-input" type="text" placeholder="نام واحد جدید…" autocomplete="off" />
          <button type="submit" class="primary-btn">افزودن</button>
        </form>
        <div id="units-list" class="list-box"></div>
      </section>
    </div>

    <!-- دیالوگ تایید سفارشی: window.confirm() داخل وب‌ویوی مینی‌اپ‌ها معمولاً کار
         نمی‌کنه یا همیشه false برمی‌گردونه، پس به‌جاش از این استفاده می‌کنیم -->
    <div id="confirm-overlay" class="confirm-overlay hidden">
      <div class="confirm-box">
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-no" class="tab-btn">انصراف</button>
          <button id="confirm-yes" class="danger-btn">تایید</button>
        </div>
      </div>
    </div>
  </div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% if dev_mode %}
<script>window.__DEV_MODE__ = true;</script>
{% endif %}
</body>
</html>
